        let userState = {
            activeTopicId: 'topic_web_source',
            completedMcqs: [],
            solvedFlags: [],
            totalScore: 0
        };

        function loadSavedProgress() {
            const saved = localStorage.getItem('cyber_ctf_progress_v2');
            if (saved) {
                try {
                    userState = { ...userState, ...JSON.parse(saved) };
                } catch(e) {}
            }
            recalculateScore();
        }

        function saveProgress() {
            localStorage.setItem('cyber_ctf_progress_v2', JSON.stringify(userState));
            recalculateScore();
            renderSidebar();
        }

        function recalculateScore() {
            let score = 0;
            TOPICS_DATA.forEach(t => {
                t.mcqs.forEach(m => {
                    if (userState.completedMcqs.includes(m.id)) {
                        score += 25; // 25 pts per MCQ
                    }
                });
                t.challenges.forEach(c => {
                    if (userState.solvedFlags.includes(c.id)) {
                        score += c.pts; // 50, 100, 150
                    }
                });
            });
            userState.totalScore = score;
            document.getElementById('userScore').innerText = `${score} PTS`;
            
            let totalCTFs = 0;
            TOPICS_DATA.forEach(t => totalCTFs += t.challenges.length);
            const solvedCount = userState.solvedFlags.length;
            document.getElementById('completionBadge').innerText = `${solvedCount} / ${totalCTFs} Flags`;
            document.getElementById('progressBar').style.width = `${(solvedCount / totalCTFs) * 100}%`;
        }

        function confirmResetProgress() {
            document.getElementById('modalOverlay').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.add('hidden');
        }

        function executeReset() {
            closeModal();
            userState.completedMcqs = [];
            userState.solvedFlags = [];
            saveProgress();
            loadTopic(userState.activeTopicId);
            showToast("All CTF progress has been reset!", "info");
        }

        function renderSidebar() {
            const nav = document.getElementById('topicNavList');
            nav.innerHTML = '';

            TOPICS_DATA.forEach(t => {
                const isActive = t.id === userState.activeTopicId;
                const solvedInTopic = t.challenges.filter(c => userState.solvedFlags.includes(c.id)).length;
                const totalInTopic = t.challenges.length;

                const btn = document.createElement('button');
                btn.onclick = () => selectTopic(t.id);
                btn.className = `w-full text-left p-2.5 rounded-xl border transition-all duration-150 flex items-center justify-between ${
                    isActive 
                        ? 'bg-cyber-panel border-cyber-accent/60 text-white shadow-md glow-green' 
                        : 'bg-cyber-card hover:bg-cyber-panel/50 border-cyber-border text-slate-300'
                }`;

                btn.innerHTML = `
                    <div class="flex flex-col gap-0.5 overflow-hidden">
                        <span class="text-[9px] font-mono font-semibold uppercase text-cyber-cyan">${t.category}</span>
                        <span class="text-xs font-medium truncate">${t.title}</span>
                    </div>
                    <div class="flex items-center space-x-1 flex-shrink-0">
                        <span class="text-[10px] font-mono px-1.5 py-0.5 rounded bg-cyber-bg border border-cyber-border text-slate-400">
                            ${solvedInTopic}/${totalInTopic}
                        </span>
                    </div>
                `;
                nav.appendChild(btn);
            });
        }

        function selectTopic(topicId) {
            userState.activeTopicId = topicId;
            renderSidebar();
            loadTopic(topicId);
        }

        function loadTopic(topicId) {
            const t = TOPICS_DATA.find(item => item.id === topicId);
            if (!t) return;

            const workspace = document.getElementById('topicWorkspace');

            // Render MCQs
            let mcqHtml = t.mcqs.map((m, idx) => {
                const isAnswered = userState.completedMcqs.includes(m.id);
                return `
                    <div class="p-3.5 rounded-xl bg-cyber-bg/70 border border-cyber-border space-y-2.5">
                        <div class="flex items-center justify-between">
                            <span class="text-[11px] font-mono font-bold text-cyber-cyan uppercase">
                                MCQ ${idx+1} [${m.level}] (+25 PTS)
                            </span>
                            ${isAnswered ? '<span class="text-[11px] font-mono text-cyber-accent flex items-center gap-1"><i class="fa-solid fa-check"></i> Answered</span>' : ''}
                        </div>
                        <p class="text-xs sm:text-sm text-slate-200 font-medium">${m.question}</p>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 pt-1" id="mcq_opts_${m.id}">
                            ${m.options.map((opt, optIdx) => `
                                <button onclick="checkMcqAnswer('${m.id}', ${optIdx}, ${m.correct})" 
                                    class="text-left px-3 py-1.5 rounded-lg text-xs font-mono border border-cyber-border bg-cyber-panel/60 hover:bg-cyber-panel text-slate-300 transition ${isAnswered && optIdx === m.correct ? 'border-cyber-accent text-cyber-accent font-bold bg-cyber-accent/10' : ''}">
                                    ${String.fromCharCode(65 + optIdx)}. ${opt}
                                </button>
                            `).join('')}

                        <div id="mcq_explain_${m.id}" class="${isAnswered ? '' : 'hidden'} p-2 rounded bg-cyber-panel/50 border border-cyber-border text-xs text-slate-300">
                            💡 <span class="font-semibold text-cyber-gold">Explanation:</span> ${m.explanation}
                        </div>
                    </div>
                `;
            }).join('');

            // Render CTF Challenges (Easy, Moderate, Hard)
            let ctfHtml = t.challenges.map((c) => {
                const isSolved = userState.solvedFlags.includes(c.id);
                const levelColor = c.level === 'Easy' ? 'text-cyber-accent border-cyber-accent/30 bg-cyber-accent/10' :
                                  c.level === 'Moderate' ? 'text-cyber-yellow border-cyber-yellow/30 bg-cyber-yellow/10' :

                return `
                    <div class="p-4 rounded-xl bg-cyber-panel/80 border border-cyber-border space-y-3.5 shadow-md">
                        <div class="flex items-center justify-between">
                            <div class="flex items-center space-x-2">
                                <span class="px-2 py-0.5 rounded text-[10px] font-mono font-bold uppercase border ${levelColor}">
                                    ${c.level} (${c.pts} PTS)
                                </span>
                                <h4 class="text-sm font-bold text-white">${c.title}</h4>
                            </div>

                        <p class="text-xs sm:text-sm text-slate-300">${c.task}</p>

                        ${renderWidget(c)}

                        <form onsubmit="handleFlagSubmit(event, '${c.id}', '${c.flag}', ${c.pts})" class="flex flex-col sm:flex-row gap-2 pt-1">
                            <input type="text" id="flagInput_${c.id}" placeholder="FLAG{...}"

            }).join('');

            workspace.innerHTML = `

                    </div>
                    <h2 class="text-xl sm:text-2xl font-bold text-white">${t.title}</h2>
                </div>

                <!-- Theory Summary -->
                <div class="p-4 rounded-xl bg-cyber-panel/60 border border-cyber-border space-y-1.5">
                    <h3 class="text-xs font-mono uppercase text-cyber-cyan tracking-wider font-bold flex items-center gap-1.5">
                        <i class="fa-solid fa-book-open"></i> Topic Summary

                    <p class="text-xs sm:text-sm text-slate-300 leading-relaxed">${t.summary}</p>
                </div>

                <!-- MCQs Section -->
                <div class="space-y-3">
                    <h3 class="text-xs font-mono uppercase text-slate-400 tracking-wider font-bold flex items-center gap-2">
                        <i class="fa-solid fa-list-check text-cyber-yellow"></i> Concept Questions (3 Levels)
                    </h3>
                    ${mcqHtml}
                </div>

                <!-- CTF Section -->
                <div class="space-y-4 pt-2">
                    <h3 class="text-xs font-mono uppercase text-slate-400 tracking-wider font-bold flex items-center gap-2">
                        <i class="fa-solid fa-flag text-cyber-gold"></i> Practical CTF Challenges (Easy / Moderate / Hard)

            document.getElementById('res_cookie').innerHTML = cookieIsAdmin ? 
                `<span class="text-cyber-accent">[ADMIN SESSION]: FLAG{cookie_tamper_admin_privilege_555}</span>` : 
                `Guest Session Active.`;
        }

        let jwtIsAdmin = false;
        function toggleJwtAdmin() {
            jwtIsAdmin = !jwtIsAdmin;
            document.getElementById('jwt_claim').innerText = `"admin": ${jwtIsAdmin}`;
            document.getElementById('jwt_claim').className = jwtIsAdmin ? 'text-cyber-accent font-bold' : 'text-rose-400';
            document.getElementById('res_jwt').innerHTML = jwtIsAdmin ? 
                `<span class="text-cyber-accent">[JWT VERIFIED]: FLAG{jwt_alg_none_token_bypass_888}</span>` : 
                `Header: {"alg":"none"}\nPayload: {"user":"guest", "admin":false}`;
        }

        function runSessPredict() {
            const val = document.getElementById('w_sess_p').value;
            const res = document.getElementById('res_sess_p');
            if (val === 'sess_001' || val === 'sess_000') {
                res.innerHTML = `<span class="text-cyber-accent">[HIJACK SUCCESS]: Authenticated as Administrator! Flag: <b>FLAG{session_prediction_admin_takeover_999}</b></span>`;
            } else { res.innerText = `Session ${val} is an active Guest account.`; }
        }

        function runIdorUrl() {
            const val = document.getElementById('w_idor_u').value;
            const res = document.getElementById('res_idor_u');
            if (val === '1') {
                res.innerHTML = `<span class="text-cyber-accent">HTTP 200 OK: User Profile ID #1 (Admin). Secret Flag: <b>FLAG{idor_url_parameter_exposed_123}</b></span>`;
            } else { res.innerText = `HTTP 200 OK: User Profile ID #${val} (Standard User).`; }
        }

        function runIdorJson() {
            const val = document.getElementById('w_idor_j').value;
            const res = document.getElementById('res_idor_j');
            if (val.includes('"account_id": 1') || val.includes('"account_id":1')) {
                res.innerHTML = `<span class="text-cyber-accent">{"status": "success", "flag": "FLAG{idor_json_api_payload_bypass_456}"}</span>`;
            } else { res.innerText = `{"status": "success", "msg": "Standard user profile data fetched."}`; }
        }

        function runIdorHpp() {
            const val = document.getElementById('w_idor_h').value;
            const res = document.getElementById('res_idor_h');
            if (val.includes('&id=1')) {
                res.innerHTML = `<span class="text-cyber-accent">[HPP OVERRIDE]: Server selected last parameter id=1 -> FLAG{idor_parameter_pollution_master_789}</span>`;
            } else { res.innerText = `Server parsed first parameter id=102.`; }
        }

        function runUplBasic() {
            const val = document.getElementById('w_upl_b').value;
            const res = document.getElementById('res_upl_b');
            if (val.endsWith('.php')) {
                res.innerHTML = `<span class="text-cyber-accent">[FILE EXECUTED]: shell.php uploaded! Flag: <b>FLAG{file_upload_unrestricted_php_111}</b></span>`;
            } else { res.innerText = "Upload failed: Only .php files execute code."; }
        }

        function runUplDouble() {
            const val = document.getElementById('w_upl_d').value;
            const res = document.getElementById('res_upl_d');
            if (val.includes('.php.')) {
                res.innerHTML = `<span class="text-cyber-accent">[DOUBLE EXTENSION BYPASS]: shell.php.jpg parsed as PHP script! Flag: <b>FLAG{file_upload_double_extension_222}</b></span>`;
            } else { res.innerText = "Upload rejected by static extension filter."; }
        }

        function runUplMime() {
            const file = document.getElementById('w_upl_m_file').value;
            const type = document.getElementById('w_upl_m_type').value;
            const res = document.getElementById('res_upl_m');
            if (file.endsWith('.php') && type === 'image/png') {
                res.innerHTML = `<span class="text-cyber-accent">[MIME SPOOF SUCCESS]: Content-Type image/png accepted for ${file}! Flag: <b>FLAG{file_upload_mime_type_spoof_333}</b></span>`;
            } else { res.innerText = "Upload blocked: Content-Type header mismatch."; }
        }

        function checkMcqAnswer(mcqId, selectedIdx, correctIdx) {
            const explainBox = document.getElementById(`mcq_explain_${mcqId}`);
            if (explainBox) explainBox.classList.remove('hidden');

            if (selectedIdx === correctIdx) {
                if (!userState.completedMcqs.includes(mcqId)) {
                    userState.completedMcqs.push(mcqId);
                    saveProgress();
                    showToast("Correct Answer! +25 PTS", "success");
                    loadTopic(userState.activeTopicId);
                } else {
                    showToast("Correct! (Already answered)", "info");
                }
            } else {
                showToast("Incorrect answer. Try again!", "error");
            }
        }

        function handleFlagSubmit(e, ctfId, correctFlag, pts) {
            e.preventDefault();
            const input = document.getElementById(`flagInput_${ctfId}`).value.trim();

            if (!input) {
                showToast("Please enter a flag token.", "warning");
                return;
            }

            if (input === correctFlag) {
                if (!userState.solvedFlags.includes(ctfId)) {
                    userState.solvedFlags.push(ctfId);
                    saveProgress();
                    showToast(`CONGRATS! Correct Flag (+${pts} PTS)`, "success");
                    loadTopic(userState.activeTopicId);
                } else {
                    showToast("Flag verified! (Already solved)", "info");
                }
            } else {
                showToast("Incorrect flag token! Double-check and try again.", "error");
            }
        }

        function toggleHint(ctfId) {
            const box = document.getElementById(`hintBox_${ctfId}`);
            const btnText = document.getElementById(`hintBtnText_${ctfId}`);
            if (box.classList.contains('hidden')) {
                box.classList.remove('hidden');
                btnText.innerText = "Hide Hint";
            } else {
                box.classList.add('hidden');
                btnText.innerText = "Show Hint";
            }
        }

        function showToast(message, type = "info") {
            const toast = document.getElementById('toastNotification');
            const icon = document.getElementById('toastIcon');
            const msg = document.getElementById('toastMsg');

            toast.classList.remove('hidden', 'bg-emerald-950', 'border-emerald-500', 'text-emerald-300', 'bg-rose-950', 'border-rose-500', 'text-rose-300', 'bg-amber-950', 'border-amber-500', 'text-amber-300');

            if (type === 'success') {
                toast.classList.add('bg-emerald-950', 'border', 'border-emerald-500', 'text-emerald-300');
                icon.className = 'fa-solid fa-circle-check text-emerald-400';
            } else if (type === 'error') {
                toast.classList.add('bg-rose-950', 'border', 'border-rose-500', 'text-rose-300');
                icon.className = 'fa-solid fa-triangle-exclamation text-rose-400';
            } else {
                toast.classList.add('bg-amber-950', 'border', 'border-amber-500', 'text-amber-300');
                icon.className = 'fa-solid fa-circle-info text-amber-400';
            }

            msg.innerText = message;
            toast.classList.remove('hidden');

            setTimeout(() => {
                toast.classList.add('hidden');
            }, 3000);
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadSavedProgress();
            renderSidebar();
            loadTopic(userState.activeTopicId);
        });
    </script>
</body>
</html>
